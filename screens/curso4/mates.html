<!-- =============================================
     CURSO4-MATES.HTML — Asignatura Matemáticas de 4º.
     Este archivo es solo el "hub" de navegación:
     Matemáticas > Estudiar / Ejercicios, más los menús
     de Estudiar y Ejercicios (sin su contenido) — mismo
     patrón que screens/curso4/english.html.

     El contenido real de cada tema vive en su propio
     archivo hermano, para que ninguno crezca sin control:
       - mates-multiplicacion.html → todo Multiplicación
         (selector con/sin ayudas, Study, ejercicios)

     Cuando se añada un tema nuevo (sumas, restas,
     problemas...), sigue el mismo patrón: un archivo
     mates-<tema>.html nuevo con su contenido, y aquí
     solo se añade su tarjeta en s-mates-study-c4 /
     s-mates-exercises-c4 (y su entrada en el fileMap de
     loadScreenLazy() en js/app.js).
     ============================================= -->

<!-- MATES 4º — menú principal -->
<div class="screen" id="s-mates-c4">
  <div class="topbar bg-purple">
    <button class="back-btn" onclick="go('s-home-curso4')">←</button>
    <h1>🔢 Matemáticas</h1>
    <span class="top-badge">4º Primaria</span>
  </div>
  <div class="sa">
    <!-- Puntos + lo más urgente a reforzar, SOLO de Matemáticas (ver
         renderMatesHubStats() en js/ui.js, llamada al entrar a esta
         pantalla desde js/app.js). Limitado a MH_REFUERZO_MAX áreas
         para no llenar la pantalla si hay muchas por debajo del 75%. -->
    <div style="margin:14px 16px 16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="slbl" id="mh-refuerzo-lbl" style="margin:0">A reforzar</div>
        <div id="mh-pts" style="font-family:var(--f);font-weight:900;font-size:14px;color:var(--purple)">⭐ 0 pts</div>
      </div>
      <div id="mh-reforzar"></div>
    </div>

    <div class="slbl">Elige una sección</div>
    <div class="mode-grid" style="margin-bottom:10px">
      <div class="mode-card" style="border-color:var(--purple);background:#EDE9FE" onclick="go('s-mates-study-c4')">
        <div class="mode-emoji">📖</div>
        <div class="mode-name" style="color:var(--purple)">Estudiar</div>
        <div class="mode-sub">Aprende los trucos</div>
      </div>
      <div class="mode-card" onclick="go('s-mates-exercises-c4')">
        <div class="mode-emoji">✏️</div>
        <div class="mode-name">Ejercicios</div>
        <div class="mode-sub">Practica por tema</div>
      </div>
    </div>
  </div>
</div>

        <div class="mode-name" style="color:var(--purple)">Multiplicación</div>
